[versions]
agp = "8.13.2"
kotlin = "2.2.21"
compose-bom = "2025.12.00"
activity = "1.11.0"
junit = "4.13.2"
android-test-runner = "1.6.2"
android-test-junit = "1.2.1"
heifwriter = "1.2.0-rc01"
exifinterface = "1.4.2"

appcompat = "1.7.1"
datastore = "1.1.7"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
junit = { module = "junit:junit", version.ref = "junit" }
android-test-runner = { module = "androidx.test:runner", version.ref = "android-test-runner" }
android-test-junit = { module = "androidx.test.ext:junit", version.ref = "android-test-junit" }
heifwriter = { module = "androidx.heifwriter:heifwriter", version.ref = "heifwriter" }
exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }

appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

