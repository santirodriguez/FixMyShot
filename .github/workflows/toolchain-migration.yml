name: Pinned toolchain migration experiment
on:
  push:
    branches: ['release/**']
    paths: ['.ci/toolchain-migration-request.json']
permissions:
  contents: read
concurrency:
  group: toolchain-migration-${{ github.ref }}
  cancel-in-progress: false
jobs:
  migration:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Preserve source-bound migration controller
        run: |
          python3 scripts/test-toolchain-migration.py
          cp scripts/prepare-toolchain-migration.py "$RUNNER_TEMP/migration.py"
          cp .ci/toolchain-migration-request.json "$RUNNER_TEMP/migration-request.json"
          git rev-parse HEAD > "$RUNNER_TEMP/migration-control.txt"
          printf 'GRADLE_USER_HOME=%s/fixmyshot-migration-gradle\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ad075068564dc8a7d8d0eca35fc1f69ff3d16464
          persist-credentials: false
          clean: true
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify original launchers and prepare the isolated candidate
        run: |
          bash scripts/bootstrap-gradle.sh
          python3 "$RUNNER_TEMP/migration.py" "$RUNNER_TEMP/migration-request.json" "$GITHUB_WORKSPACE"
          mkdir -p evidence
          cp "$RUNNER_TEMP/migration.py" evidence/migration-controller.py
          cp "$RUNNER_TEMP/migration-request.json" evidence/migration-request.json
          cp "$RUNNER_TEMP/migration-control.txt" evidence/migration-control.txt
          git rev-parse HEAD > evidence/base-source.txt
          bash scripts/setup-android.sh
      - name: Generate the new standard wrapper and refresh selected graphs
        run: |
          ./gradlew --no-daemon --console=plain --write-locks --write-verification-metadata sha256 \
            wrapper --gradle-version 9.4.1 --distribution-type bin \
            --gradle-distribution-sha256-sum 2ab2958f2a1e51120c326cad6f385153bb11ee93b3c216c5fccebfdfbb7ec6cb
          python3 "$RUNNER_TEMP/migration.py" "$RUNNER_TEMP/migration-request.json" "$GITHUB_WORKSPACE" --verify-generated-wrapper
          ./gradlew --no-daemon --console=plain --write-locks --write-verification-metadata sha256 \
            buildEnvironment :app:dependencies :core:dependencies :codec-native:dependencies \
            > evidence/migration-dependencies.txt
      - name: Compile the candidate without claiming frozen-source acceptance
        run: |
          ./gradlew --no-daemon --console=plain --write-locks --write-verification-metadata sha256 \
            :core:test :app:lintDebug :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest
          python3 scripts/check-apk.py app/build/outputs/apk/release/app-release-unsigned.apk > evidence/release-native.json
          python3 scripts/check-apk-legal.py app/build/outputs/apk/release/app-release-unsigned.apk > evidence/release-legal.json
          sha256sum app/build/outputs/apk/release/app-release-unsigned.apk > evidence/experimental-apk.sha256
      - name: Complete Kotlin common locks with existing graph constraints
        run: |
          cp app/gradle.lockfile evidence/app-before-common-update.lockfile
          cp core/gradle.lockfile evidence/core-before-common-update.lockfile
          cp codec-native/gradle.lockfile evidence/native-before-common-update.lockfile
          ./gradlew --no-daemon --console=plain \
            --update-locks org.jetbrains.kotlin:kotlin-stdlib-common --write-verification-metadata sha256 \
            :core:test :app:lintDebug :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest \
            > evidence/common-lock-update.txt 2>&1
          sha256sum app/gradle.lockfile core/gradle.lockfile codec-native/gradle.lockfile \
            gradle/verification-metadata.xml > evidence/strict-inputs.sha256
      - name: Rebuild derived inputs with locked read mode and no metadata writes
        run: |
          ./gradlew --no-daemon --console=plain --no-build-cache --rerun-tasks \
            :core:test :app:lintDebug :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest \
            > evidence/strict-read-build.txt 2>&1
          sha256sum -c evidence/strict-inputs.sha256
          python3 scripts/check-apk.py app/build/outputs/apk/release/app-release-unsigned.apk > evidence/strict-release-native.json
          python3 scripts/check-apk-legal.py app/build/outputs/apk/release/app-release-unsigned.apk > evidence/strict-release-legal.json
          sha256sum app/build/outputs/apk/release/app-release-unsigned.apk > evidence/strict-experimental-apk.sha256
      - name: Preserve exact derived inputs and truthful partial evidence
        if: always()
        run: |
          mkdir -p evidence/derived
          for path in gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties \
            gradle/verification-metadata.xml gradle/libs.versions.toml build.gradle.kts app/build.gradle.kts \
            codec-native/build.gradle.kts scripts/setup-android.sh app/gradle.lockfile core/gradle.lockfile codec-native/gradle.lockfile; do
            if [[ -f "$path" ]]; then mkdir -p "evidence/derived/$(dirname "$path")"; cp "$path" "evidence/derived/$path"; fi
          done
          git diff --binary > evidence/derived.patch
          printf '%s\n' 'EXPERIMENTAL_DERIVED_CHECKOUT; not a release candidate, trust policy or runtime acceptance' > evidence/SCOPE.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: toolchain-migration-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            evidence/
            core/build/test-results/test/*.xml
            app/build/reports/lint-results-debug.*
            app/build/outputs/apk/release/app-release-unsigned.apk
