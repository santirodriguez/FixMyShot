name: Pinned dependency security inventory
on:
  push:
    branches: ['release/**']
    paths: ['.ci/security-inventory-request.json']
permissions:
  contents: read
concurrency:
  group: security-inventory-${{ github.ref }}
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check request, inventory and replay refusal boundaries
        run: |
          python3 scripts/test-dependency-security.py
          python3 scripts/test-security-review.py
      - name: Collect only the explicitly pinned security inventory
        run: |
          python3 scripts/audit-dependency-security.py .ci/security-inventory-request.json evidence/security \
            --control-commit "${{ github.sha }}" --standalone
      - name: Preserve truthful complete or partial captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-inventory-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: evidence/security/
